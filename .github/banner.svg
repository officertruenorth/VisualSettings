<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="VisualSettings by TNStudios">
  <defs>
    <radialGradient id="glow" cx="78%" cy="20%" r="70%">
      <stop offset="0" stop-color="#1C7FBD" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#1C7FBD" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1C7FBD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="110%" r="55%">
      <stop offset="0" stop-color="#8fd0ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#1C7FBD"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#1C7FBD" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="20" fill="#0b0d12"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1278" height="318" rx="19" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="96" fill="#8fd0ff" font-size="15" font-weight="600" letter-spacing="3">TNSTUDIOS · LEGACY &amp; ENHANCED</text>
    <text x="68" y="178" fill="url(#flow)" font-size="68" font-weight="700" filter="url(#shadow)">VisualSettings</text>
    <text x="72" y="226" fill="#a0a0a0" font-size="22" font-weight="500">Server-synced visual settings with selectable styles and brightness profiles</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
    <rect x="72" y="252" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="107" y="272" fill="#c4c4c4" text-anchor="middle">OFF</text>
    <rect x="154" y="252" width="108" height="30" rx="15" fill="#1C7FBD"/>
    <text x="208" y="272" fill="#ffffff" text-anchor="middle">VANILLA</text>
    <rect x="274" y="252" width="108" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#8fd0ff" stroke-opacity="0.35"/>
    <text x="328" y="272" fill="#d7ecff" text-anchor="middle">VISUALV</text>
    <rect x="394" y="252" width="156" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#8fd0ff" stroke-opacity="0.35"/>
    <text x="472" y="272" fill="#d7ecff" text-anchor="middle">VISUALVANILLA</text>
  </g>
</svg>
